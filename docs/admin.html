<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Aanwezigheid admin — De Scheve Toren</title>
  <link rel="stylesheet" href="./assets/site.css?v=20260923-admin">
  <style>
    #adminTable select { min-width: 7.5rem; padding: .45rem .5rem; border: 1px solid var(--border); border-radius: .45rem; background: var(--panel); color: var(--text); font: inherit; }
    #adminTable select:disabled { opacity: .6; cursor: not-allowed; }
    #adminTable td { vertical-align: middle; }
    .admin-actions { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
    .save-hint, .lichess-user, .lichess-status { color: var(--muted); margin: 0; }
    .lichess-login { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin-top:1rem; }
  </style>
</head>
<body>
<div id="site-header"></div>
<main class="page-shell">
  <header class="topbar">
    <div><p class="eyebrow">De Scheve Toren</p><h1>Aanwezigheid admin</h1></div>
    <a class="button secondary" href="./attendance.html">← Aanwezigheid</a>
  </header>
  <section class="panel intro-panel">
    <p class="status-badge">Admin</p>
    <p>Alleen Lichess-admins (`is_admin` in de spreadsheet) zien de volledige matrix.</p>
    <p id="adminStatus" class="api-status" role="status">Laden…</p>
    <div class="lichess-login" aria-label="Lichess login">
      <button id="lichessLoginBtn" class="button primary" type="button">Inloggen met Lichess</button>
      <button id="lichessLogoutBtn" class="button secondary" type="button" hidden>Uitloggen</button>
      <p id="lichessUser" class="lichess-user" hidden></p>
    </div>
    <p id="lichessStatus" class="lichess-status" role="status">Niet ingelogd.</p>
  </section>
  <section id="adminSection" class="panel" hidden>
    <div class="admin-actions">
      <button id="reloadBtn" class="button primary" type="button">Vernieuwen</button>
      <button id="saveBtn" class="button success" type="button">Wijzigingen opslaan</button>
      <button id="exportBtn" class="button muted" type="button">Export CSV</button>
      <p class="save-hint">Verleden speeldagen zijn vergrendeld.</p>
    </div>
    <div class="admin-table-wrap"><table id="adminTable"><thead></thead><tbody></tbody></table></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="./config.js?v=20260923"></script>
<script src="./assets/site.js?v=20260923"></script>
<script src="./lichess-auth.js?v=20260923"></script>
<script src="./admin.js?v=20260923"></script>
</body>
</html>
