<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aanwezigheid — De Scheve Toren</title>
  <link rel="stylesheet" href="./attendance.css?v=20260919-toggle">
  <style>
    .lichess-login { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin-top:1rem; }
    .lichess-user { color:var(--muted); margin:0; }
    .lichess-status { color:var(--muted); margin:.5rem 0 0; }
  </style>
</head>
<body>
<main class="page-shell">
  <header class="topbar">
    <div><p class="eyebrow">De Scheve Toren</p><h1>Aanwezigheid 2026–2027</h1></div>
    <a class="button secondary" href="./index.html">← Terug</a>
  </header>
  <section class="panel intro-panel">
    <p class="status-badge">Aanwezigheid senioren</p>
    <p>Klik op een schakelaar om tussen aanwezig en afwezig te wisselen. Afgelopen speelavonden zijn grijs en vergrendeld.</p>
    <p id="apiStatus" class="api-status" role="status">Laden…</p>
    <div class="lichess-login" aria-label="Lichess login">
      <button id="lichessLoginBtn" class="button primary" type="button">Inloggen met Lichess</button>
      <button id="lichessLogoutBtn" class="button secondary" type="button" hidden>Uitloggen</button>
      <p id="lichessUser" class="lichess-user" hidden></p>
    </div>
    <p id="lichessStatus" class="lichess-status" role="status">Niet ingelogd.</p>
  </section>
  <section class="panel tool-panel">
    <div class="tool-row"><label class="field-label" for="playerSelect">Speler</label><select id="playerSelect"></select></div>
    <div class="tool-row stacked"><label class="field-label" for="inviteCode">Uitnodigingscode</label><input id="inviteCode" type="text" placeholder="Bijv. ST-7F4K-92QX"></div>
    <div class="tool-row actions"><button id="linkPlayerBtn" class="button primary" type="button">Koppel speler</button><button id="saveBtn" class="button success" type="button">Bewaar aanwezigheid</button><button id="exportBtn" class="button secondary" type="button">Download CSV</button></div>
  </section>
  <section class="panel">
    <div class="list-header"><div class="list-heading"><h2>Jouw speeldagen</h2><span class="legend"><span class="legend-dot present"></span>Aanwezig <span class="legend-dot absent"></span>Afwezig <span class="legend-dot past"></span>Verleden</span></div><label class="bulk-toggle">Snel instellen: <button id="allAttendanceToggle" class="attendance-switch" type="button" aria-pressed="false"><span class="switch-track" aria-hidden="true"></span><span class="switch-text">Afwezig</span></button></label></div>
    <div id="attendanceTable" class="attendance-list"></div>
  </section>
</main>
<script src="./attendance.js?v=20260919-players-v2"></script>
<script src="./lichess-auth.js?v=20260919-1"></script>
</body>
</html>
