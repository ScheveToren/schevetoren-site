<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Externe competitie — De Scheve Toren</title>
  <meta name="description" content="HSB- en KNSB-wedstrijden van De Scheve Toren.">
  <link rel="stylesheet" href="./assets/site.css?v=20261006-netstand">
</head>
<body>
<div id="site-header"></div>
<main class="page-shell">
  <header class="topbar">
    <div><p class="eyebrow">De Scheve Toren</p><h1 data-i18n="nav.external">Externe competitie</h1></div>
    <a class="button secondary" href="./index.html" data-i18n="nav.back">← Terug</a>
  </header>
  <section class="panel intro-panel">
    <p>Overzicht van teamwedstrijden in de Haagse Schaakbond (HSB) en KNSB. Stand en uitslagen komen automatisch van NetStand.</p>
    <p class="meta" id="netstand-updated">Laden…</p>
  </section>
  <div id="externe-root" aria-live="polite"></div>
</main>
<div id="site-footer"></div>
<script src="./config.js?v=20260924"></script>
<script src="./assets/site.js?v=20260924"></script>
<script>
  const WEEKDAYS = ["zo", "ma", "di", "wo", "do", "vr", "za"];
  const MONTHS = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDate(match) {
    if (match.dateIso) {
      const [y, m, d] = match.dateIso.split("-").map(Number);
      // NetStand sometimes parks TBD rounds on placeholder years (e.g. 2066).
      if (y > 2050) return "n.n.b.";
      const dt = new Date(Date.UTC(y, m - 1, d));
      const wd = WEEKDAYS[dt.getUTCDay()];
      return `${wd} ${d} ${MONTHS[m - 1]} ${y}`;
    }
    return match.date || "n.n.b.";
  }

  function renderStandings(standings) {
    if (!standings?.length) {
      return '<p class="meta">Stand nog niet beschikbaar.</p>';
    }
    const rows = standings.map((row) => {
      const cls = row.isUs ? ' class="is-us"' : "";
      return `<tr${cls}><td>${esc(row.rank)}</td><td>${esc(row.team)}</td><td>${esc(row.mp)}</td><td>${esc(row.bp)}</td></tr>`;
    }).join("");
    return `
      <table class="info-table standings-table">
        <thead><tr><th>#</th><th>Team</th><th>MP</th><th>BP</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function renderMatches(matches) {
    if (!matches?.length) {
      return '<p class="meta">Programma nog niet beschikbaar.</p>';
    }
    const rows = matches.map((match) => {
      const home = match.homeIsUs ? `<strong>${esc(match.home)}</strong>` : esc(match.home);
      const away = match.awayIsUs ? `<strong>${esc(match.away)}</strong>` : esc(match.away);
      return `<tr>
        <td>${esc(formatDate(match))}</td>
        <td>${home}</td>
        <td>–</td>
        <td>${away}</td>
        <td>${esc(match.score)}</td>
      </tr>`;
    }).join("");
    return `
      <table class="info-table">
        <thead><tr><th>Datum</th><th>Thuis</th><th></th><th>Uit</th><th>Uitslag</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function renderTeam(team) {
    return `
      <section class="panel">
        <h2><a href="${esc(team.divisionUrl)}" target="_blank" rel="noopener noreferrer">${esc(team.title)}</a></h2>
        <p class="meta">
          <a href="${esc(team.divisionUrl)}" target="_blank" rel="noopener noreferrer">Stand op NetStand →</a>
          ·
          <a href="${esc(team.teamUrl)}" target="_blank" rel="noopener noreferrer">Wedstrijden op NetStand →</a>
        </p>
        <h3 class="subhead">Stand</h3>
        ${renderStandings(team.standings)}
        <h3 class="subhead">Programma</h3>
        ${renderMatches(team.matches)}
      </section>`;
  }

  async function mount() {
    const root = document.getElementById("externe-root");
    const updated = document.getElementById("netstand-updated");
    try {
      const response = await fetch("./data/externe-competitie.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (updated) {
        const when = data.updatedAt ? new Date(data.updatedAt).toLocaleString("nl-NL") : "onbekend";
        updated.textContent = `Laatst bijgewerkt vanaf NetStand: ${when}`;
      }
      root.innerHTML = (data.teams || []).map(renderTeam).join("") ||
        '<section class="panel"><p class="api-status error">Geen teams gevonden.</p></section>';
    } catch (error) {
      if (updated) updated.textContent = "Kon NetStand-data niet laden.";
      root.innerHTML = '<section class="panel"><p class="api-status error">Kon de externe competitie niet laden. Probeer later opnieuw of open NetStand via de links op de oude pagina.</p></section>';
    }
  }

  mount();
</script>
</body>
</html>
