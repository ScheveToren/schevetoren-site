<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Uitslagen — De Scheve Toren</title>
  <meta name="description" content="Senioren- en jeugdstandings van De Scheve Toren.">
  <link rel="stylesheet" href="./assets/site.css?v=20260924-cms">
  <style>
    .standings-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: 1rem 0 1.25rem;
    }
    .standings-tabs button {
      border: 1px solid var(--border, #dfe6ee);
      background: #fff;
      color: var(--text, #1d2b3a);
      border-radius: 999px;
      padding: .55rem .9rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .standings-tabs button.active {
      background: var(--primary, #2e6bff);
      color: #fff;
      border-color: var(--primary, #2e6bff);
    }
    .standings-panel {
      display: none;
    }
    .standings-panel.active {
      display: block;
    }
    .season-links {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: 0 0 1rem;
      padding: 0;
      list-style: none;
    }
    .season-links a {
      display: inline-block;
      padding: .45rem .7rem;
      border-radius: 999px;
      background: #f3f6fb;
      color: var(--primary-dark, #183b73);
      text-decoration: none;
      font-weight: 700;
    }
    .season-links a:hover {
      background: #e8f0ff;
    }
    .standings-frame {
      width: 100%;
      min-height: 1200px;
      border: 1px solid var(--border, #dfe6ee);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .standings-frame-inner {
      width: 100%;
      min-height: 1200px;
      background: #fff;
    }
    .standings-frame-inner > * {
      max-width: none;
    }
  </style>
</head>
<body>
<div id="site-header"></div>
<main class="page-shell">
  <header class="topbar">
    <div><p class="eyebrow">De Scheve Toren</p><h1>Uitslagen</h1></div>
    <a class="button secondary" href="./index.html" data-i18n="nav.back">← Terug</a>
  </header>

  <section class="panel intro-panel">
    <div class="standings-tabs" aria-label="Uitslagen tabs">
      <button class="tab active" type="button" data-target="senioren">Senioren</button>
      <button class="tab" type="button" data-target="jeugd">Jeugd</button>
    </div>

    <div id="senioren" class="standings-panel active">
      <ul class="season-links">
        <li><a href="./2026-2027/" target="senior-frame">2026-2027</a></li>
        <li><a href="./2025-2026/" target="senior-frame">2025-2026</a></li>
      </ul>
      <div class="standings-frame"><div class="standings-frame-inner" id="senior-frame"></div></div>
    </div>

    <div id="jeugd" class="standings-panel">
      <ul class="season-links">
        <li><a href="./jeugd/2026-2027/" target="jeugd-frame">2026-2027</a></li>
        <li><a href="./jeugd/2025-2026/" target="jeugd-frame">2025-2026</a></li>
      </ul>
      <div class="standings-frame"><div class="standings-frame-inner" id="jeugd-frame"></div></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="./config.js?v=20260924-cms"></script>
<script src="./assets/site.js?v=20260924-cms"></script>
<script>
  function applyTab(target) {
    document.querySelectorAll('.tab').forEach((button) => {
      button.classList.toggle('active', button.dataset.target === target);
    });
    document.querySelectorAll('.standings-panel').forEach((panel) => {
      panel.classList.toggle('active', panel.id === target);
    });
  }

  async function loadSeasonPanel(targetId, url) {
    const container = document.getElementById(targetId);
    if (!container) return;

    try {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error('Failed to load standings');
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const body = doc.body;

      container.innerHTML = '';
      for (const node of Array.from(body.childNodes)) {
        container.appendChild(node.cloneNode(true));
      }

      const baseUrl = new URL(url, window.location.href);
      const seasonCss = new URL('sevilla.css', baseUrl).toString();
      const siteCss = './assets/site.css?v=20260924-cms';

      const existingStylesheets = container.querySelectorAll('link[rel="stylesheet"]');
      existingStylesheets.forEach((link) => link.remove());

      const siteLink = document.createElement('link');
      siteLink.rel = 'stylesheet';
      siteLink.href = siteCss;
      container.insertBefore(siteLink, container.firstChild);

      const seasonLink = document.createElement('link');
      seasonLink.rel = 'stylesheet';
      seasonLink.href = seasonCss;
      container.insertBefore(seasonLink, siteLink.nextSibling);

      container.querySelectorAll('a').forEach((a) => {
        a.target = '_blank';
        a.rel = 'noopener';
      });
    } catch (error) {
      container.innerHTML = '<p>Kon de standings niet laden.</p>';
    }
  }

  document.querySelectorAll('.tab').forEach((button) => {
    button.addEventListener('click', () => {
      applyTab(button.dataset.target);
      const target = button.dataset.target;
      const url = target === 'jeugd' ? './jeugd/2026-2027/' : './2026-2027/';
      loadSeasonPanel(target === 'jeugd' ? 'jeugd-frame' : 'senior-frame', url);
    });
  });

  document.querySelectorAll('.season-links a').forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      const href = link.getAttribute('href');
      const targetId = link.getAttribute('target');
      const tab = targetId === 'jeugd-frame' ? 'jeugd' : 'senioren';
      applyTab(tab);
      loadSeasonPanel(targetId, href);
    });
  });

  const params = new URLSearchParams(window.location.search);
  const requestedTab = params.get('tab');
  const defaultTab = requestedTab === 'jeugd' ? 'jeugd' : 'senioren';
  applyTab(defaultTab);
  loadSeasonPanel(defaultTab === 'jeugd' ? 'jeugd-frame' : 'senior-frame', defaultTab === 'jeugd' ? './jeugd/2026-2027/' : './2026-2027/');
</script>
</body>
</html>
