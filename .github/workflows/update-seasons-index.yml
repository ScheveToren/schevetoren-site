name: Update site generated files

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/update-seasons-index.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: pip install markdown

      - name: Verify generator scripts
        run: python3 -m py_compile scripts/*.py

      - name: Generate site artifacts
        run: |
          python3 scripts/generate-seasons-index.py
          python3 scripts/generate-calendar-ics.py
          python3 scripts/generate-posts-index.py
          python3 scripts/generate-site-pages.py
          python3 scripts/generate-seo-files.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/seizoenen.html docs/HuidigSeizoen/index.html docs/kalender docs/nieuws docs/contact.html docs/jeugd.html docs/gedragsregels.html docs/sitemap.xml docs/robots.txt || true
          if ! git diff --staged --quiet; then
            git commit -m "Automated: update generated site files"
            git push -u origin main
          else
            echo "No changes to commit"
          fi
