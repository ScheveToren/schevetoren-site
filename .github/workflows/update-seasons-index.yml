name: Update seasons index

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/generate-seasons-index.py'
      - '.github/workflows/update-seasons-index.yml'
      
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate seasons index
        run: python3 scripts/generate-seasons-index.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/HuidigSeizoen/index.html || true
          if ! git diff --staged --quiet; then
            git commit -m "Automated: update seasons index (via GitHub Action)"
            git push
          else
            echo "No changes to commit"
          fi
